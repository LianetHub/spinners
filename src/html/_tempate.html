<!DOCTYPE html>
<html lang="@@lang">
    @@include('_head.html', {
    'title': 'Erabet.io'
    })
    <body>
        <div class="wrapper">
            <header class="header">
                <div class="header__container">
                    <a href="/" class="header__logo">
                        <img src="@img/logo.svg" alt="logo">
                    </a>
                    <h1 class="header__title">
                        @@title
                    </h1>
                    <a href="https://www.erabet.io/es-MX/landing" class="header__btn btn btn-primary stag-link">@@reg-btn</a>
                </div>
            </header>
            <main class="page">
                <section class="main">
                    <div class="main__container">
                        <h1 class="main__title">@@main-title</h1>
                        <div class="main__spinner">
                            <div class="main__spinner-image">
                                <div class="main__spinner-selector">
                                    <img src="@img/selector.png" alt="selector">
                                </div>
                                <div class="main__spinner-main">
                                    <div class="main__spinner-dots">
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                        <div class="dot dot-even"></div>
                                        <div class="dot dot-odd"></div>
                                    </div>
                                    <div class="main__spinner-wheel">
                                        <img src="@img/wheel.svg" alt="wheel">
                                    </div>
                                </div>
                                <button type="button" class="main__spinner-btn">
                                    <span>
                                        @@spinner-btn
                                    </span>
                                </button>
                            </div>
                        </div>
                        <div class="main__image">
                            <img src="@img/fortune-tiger.png" alt="image">
                        </div>
                        <div class="main__image-mobile">
                            <img src="@img/Olympus.png" alt="image">
                        </div>
                    </div>
                </section>
            </main>
            <footer class="footer">
                <div class="footer__container">
                    <div class="footer__age">
                        <img src="@img/age.svg" alt="18+">
                    </div>
                    <div class="footer__feedback">
                        @@feedback:<a href="mailto:hello@erabet.io">hello@erabet.io</a>
                    </div>
                    <div class="footer__links">
                        <a href="" class="footer__link">@@privacy-1</a>
                        <a href="" class="footer__link">@@privacy-2</a>
                    </div>

                    <div class="footer__payments">
                        <div class="footer__payment">
                            <img src="@img/mifinity.svg" alt="payment">
                        </div>
                        <div class="footer__payment">
                            <img src="@img/spei.svg" alt="payment">
                        </div>
                        <div class="footer__payment">
                            <img src="@img/Oxxo.png" alt="payment">
                        </div>
                        <div class="footer__payment">
                            <img src="@img/mercado.svg" alt="payment">
                        </div>
                    </div>
                </div>
            </footer>
        </div>
        <div id="congratulations" class="popup">
            <div class="popup__content">
                <div class="popup__title gradient-text">
                    @@title-popup
                </div>
                <div class="popup__text">
                    @@text-popup
                </div>
                <a href="https://www.erabet.io/es-MX?sign-up=modal" class="popup__btn btn btn-primary stag-link">@@btn-text</a>
            </div>
        </div>
        @@include('_js.html', {})
    </body>
</html>
